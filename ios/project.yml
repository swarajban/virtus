# XcodeGen spec — the .xcodeproj is generated from this (CI does it; locally:
# `brew install xcodegen && xcodegen generate`). Don't commit Virtus.xcodeproj.
name: Virtus
options:
  bundleIdPrefix: com.swarajban
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Virtus:
    type: application
    platform: iOS
    sources:
      - path: Virtus
      # Single source of truth for program data, shared with the web app.
      - path: ../client/public/powerbuilding_data.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarajban.virtus
        PRODUCT_NAME: Virtus
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8G7N7547R6
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  Virtus:
    build:
      targets:
        Virtus: all
    run:
      config: Debug
    archive:
      config: Release
